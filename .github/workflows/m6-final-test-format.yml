name: M6 one-shot test formatting
on:
  push:
    branches: [feat/m6-execution-backend]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format M6 test and remove workflow
        run: |
          python -m pip install "black==26.10.1"
          black --line-length 110 backend/tests/integration/test_execution_api.py
          git rm .github/workflows/m6-final-test-format.yml
          git add backend/tests/integration/test_execution_api.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(execution): Black-format PostgreSQL test extensions"
          git push origin HEAD:feat/m6-execution-backend
