name: M8 final style pass
on:
  push:
    branches: [feat/m8-kpi-backend]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format KPI regression and remove temporary workflow
        shell: bash
        run: |
          python -m pip install "black==26.10.1"
          black --line-length 110 backend/tests/integration/test_m8_kpi_api.py
          git rm .github/workflows/m8-final-style.yml
          git add backend/tests/integration/test_m8_kpi_api.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(kpi): normalize final PostgreSQL regression tests"
          git push origin HEAD:feat/m8-kpi-backend
