name: dev2-notify-temporary-format-and-targeted-tests
on:
  push:
    branches:
      - feat/dev2-notifications-outbox-n1-n5-20261109
permissions:
  contents: write
jobs:
  check-notifications:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Format only notification-owned files
        run: |
          python -m pip install 'black==26.10.1' 'ruff==0.17.4'
          files="backend/app/services/notify_service.py backend/app/services/notification_delivery.py backend/app/services/notification_snapshot.py backend/app/api/v1/notifications.py backend/tests/unit/test_notification_snapshot.py backend/tests/integration/test_notify_backend.py backend/tests/integration/test_notify_api.py"
          ruff check --fix $files
          black --line-length 110 $files
          git config user.name 'dev2-notify-format-bot'
          git config user.email 'dev2-notify-format-bot@users.noreply.github.com'
          git add -- $files
          if ! git diff --cached --quiet; then
            git commit -m 'style(notify): apply Ruff and Black to notification files'
            git push origin HEAD:feat/dev2-notifications-outbox-n1-n5-20261109
          fi
      - uses: ./.github/actions/postgres
      - name: Install backend development dependencies
        run: |
          cd backend
          pip install -e '.[dev]'
      - name: Run focused PostgreSQL notification tests
        run: |
          cd backend
          pytest -q tests/unit/test_notification_snapshot.py tests/integration/test_notify_backend.py tests/integration/test_notify_api.py tests/integration/test_notification_delivery.py
