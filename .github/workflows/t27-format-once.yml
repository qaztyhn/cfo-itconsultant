name: T27 one-time Black format on reviewed demo fixture files
on:
  push:
    branches: [feat/r3-t27-same-order-driver-step8]
    paths: [.github/workflows/t27-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Black format T27 synthetic demo and tests only
        run: |
          python -m pip install black==26.10.1
          black backend/app/demo_t27_gps.py backend/tests/unit/test_e0_04_d7_fixture.py
          git diff --check
          git add backend/app/demo_t27_gps.py backend/tests/unit/test_e0_04_d7_fixture.py
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(t27): Black format disposable T12/T13 fixtures"
            git push origin HEAD:feat/r3-t27-same-order-driver-step8
          fi
