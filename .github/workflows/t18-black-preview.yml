name: t18-black-preview
on:
  push:
    branches: [chore/t18-black-format-preview-20261108]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Black
        run: python -m pip install black==26.10.1
      - name: Show exact Black diff
        working-directory: backend
        run: python -m black --diff --no-color tests/integration/test_transfer_api.py
