name: M2 Data Integration UI screenshot evidence
on:
  push:
    branches: [feat/m2-integration-ui]
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Render real DataIntegration component with labeled contract preview
        shell: bash
        run: |
          cat > frontend/__m2_capture.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
          <body><div id="root"></div><script type="module" src="/__m2_capture.tsx"></script></body></html>
          HTML
          cat > frontend/__m2_capture.tsx <<'TSX'
          import React from "react";
          import ReactDOM from "react-dom/client";
          import { QueryClient, QueryClientProvider } from "@tanstack/react-query";
          import { MemoryRouter, Route, Routes } from "react-router-dom";
          import { AppShell } from "./src/components/AppShell";
          import { useAuthStore } from "./src/app/store";
          import { DataIntegration } from "./src/features/it/DataIntegration";
          import "./src/styles/index.css";
          useAuthStore.getState().setAuth({
            access_token: "synthetic-capture-only", token_type: "bearer", expires_in: 3600,
            user: {
              id: 9100, employee_id: 9100, name: "Synthetic Admin", roles: ["admin"], market: "SE",
              location_ids: [], locale: "en", kpi_scopes: [],
            },
          }, "synthetic-preview@invalid.test");
          const client = new QueryClient({ defaultOptions: { queries: { retry: false } } });
          ReactDOM.createRoot(document.getElementById("root")!).render(
            <QueryClientProvider client={client}>
              <MemoryRouter initialEntries={["/it/integration"]}>
                <Routes><Route element={<AppShell />}>
                  <Route path="/it/integration" element={<DataIntegration />} />
                </Route></Routes>
              </MemoryRouter>
            </QueryClientProvider>
          );
          TSX
          cd frontend
          VITE_USE_MOCKS=true npm run dev -- --host 127.0.0.1 > /tmp/m2-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173/__m2_capture.html >/dev/null; then break; fi
            sleep 0.5
          done
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No headless Chrome installed; cannot claim screenshot evidence."
            exit 1
          fi
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --hide-scrollbars --screenshot=/tmp/m2-integration-desktop.png \
            --window-size=1760,1900 --virtual-time-budget=6000 http://127.0.0.1:5173/__m2_capture.html
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --hide-scrollbars --screenshot=/tmp/m2-integration-laptop.png \
            --window-size=1400,1600 --virtual-time-budget=6000 http://127.0.0.1:5173/__m2_capture.html
          test -s /tmp/m2-integration-desktop.png
          test -s /tmp/m2-integration-laptop.png
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: m2-integration-dashboard-screenshots
          path: |
            /tmp/m2-integration-desktop.png
            /tmp/m2-integration-laptop.png
          retention-days: 30
      - name: Remove temporary capture workflow from the branch
        if: always()
        shell: bash
        run: |
          git rm .github/workflows/m2-integration-screenshots.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(integration-ui): finish screenshot evidence workflow"
          git push origin HEAD:feat/m2-integration-ui
