name: KPI formatter diagnostic
on:
  push:
    branches: [feat/t22-five-kpis]
jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install black==26.10.1
      - run: black --diff backend/app/services/kpi_service.py backend/tests/integration/test_m8_kpi_api.py
