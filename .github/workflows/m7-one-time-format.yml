name: M7 one-time formatting
on:
  push:
    branches: [feat/m7-risk-alerts]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply configured formatting to M7 files and remove this workflow
        shell: bash
        run: |
          python -m pip install "black==26.10.1" "ruff==0.17.4"
          cd backend
          ruff check --select I --fix app/services/risk_service.py app/services/alert_service.py app/api/v1/alerts.py app/engine/forecast.py tests/unit/test_risk_m7.py tests/integration/test_risk_alerts_api.py tests/integration/test_risk_service_m7.py
          black --line-length 110 app/services/risk_service.py app/services/alert_service.py app/api/v1/alerts.py app/engine/forecast.py tests/unit/test_risk_m7.py tests/integration/test_risk_alerts_api.py tests/integration/test_risk_service_m7.py
          cd ..
          git rm .github/workflows/m7-one-time-format.yml
          git add backend/app/services/risk_service.py backend/app/services/alert_service.py backend/app/api/v1/alerts.py backend/app/engine/forecast.py backend/tests/unit/test_risk_m7.py backend/tests/integration/test_risk_alerts_api.py backend/tests/integration/test_risk_service_m7.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(risk): format M7 owned files"
          git push origin HEAD:feat/m7-risk-alerts
