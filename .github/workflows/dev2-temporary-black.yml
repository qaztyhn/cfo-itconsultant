name: dev2-temporary-black-formatter
on:
  push:
    branches:
      - feat/dev2-deterministic-demo-fixtures-20261109
permissions:
  contents: write
jobs:
  format-seed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Format only Dev 2 seed-owned Python files
        run: |
          python -m pip install 'black==26.10.1'
          black --line-length 110 \
            backend/app/seed/generate_data.py \
            backend/app/seed/scenarios.py \
            backend/app/seed/driver_shifts.py \
            backend/tests/unit/test_seed_scenarios.py \
            backend/tests/integration/test_demo_driver_shifts.py \
            source_system/app/seed_demo.py \
            source_system/tests/unit/test_demo_seed_manifest.py \
            source_system/tests/integration/test_demo_seed.py
          git config user.name 'dev2-seed-format-bot'
          git config user.email 'dev2-seed-format-bot@users.noreply.github.com'
          git add -- backend/app/seed/generate_data.py backend/app/seed/scenarios.py backend/app/seed/driver_shifts.py backend/tests/unit/test_seed_scenarios.py backend/tests/integration/test_demo_driver_shifts.py source_system/app/seed_demo.py source_system/tests/unit/test_demo_seed_manifest.py source_system/tests/integration/test_demo_seed.py
          if ! git diff --cached --quiet; then
            git commit -m 'style(seed): format demo seed and tests with Black'
            git push origin HEAD:feat/dev2-deterministic-demo-fixtures-20261109
          fi
