name: T27 integrated pre-Sync to Mailpit/Driver Chrome (disposable E0-04)
on:
  push:
    branches: [feat/r3-t27-integrated-e004, feat/r3-t27-same-order-driver-step8, feat/r3-t27-complete-replay]
  pull_request:
    branches: [feat/r3-t27-integrated-e004]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e0-e1-e2-e3-t27:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        scenario: [complete, expired_t12, reporting]
    env:
      APP_ENV: test
      DEMO_DISPOSABLE: "1"
      APP_NOW: "2026-11-04T10:05:00+01:00"
      COMPOSE_PROJECT_NAME: ${{ matrix.scenario == 'reporting' && 'cfo-demo-t26' || 'cfo-demo-e004' }}
      COMPOSE_FILE: "docker-compose.yml:tools/t27_e1_compose.override.yml"
      PYTHONPATH: ".:backend"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend E0/E1/T27 and Playwright
        working-directory: backend
        run: |
          python -m pip install -e ".[dev]" "playwright>=1.50,<2" python-dotenv tzdata
          python -m playwright install chrome
      - name: Validate strict Driver step-8 evidence classifier
        run: python -m unittest discover -s tools/tests -p 'test_t27_driver_step8.py' -v
      - name: Install real frontend
        working-directory: frontend
        run: npm ci
      - name: Generate ephemeral LOCAL disposable secrets (not uploaded or printed)
        run: |
          python - <<'PY'
          from os import environ
          from pathlib import Path
          from secrets import token_urlsafe
          from urllib.parse import quote
          password = quote(token_urlsafe(24), safe="")
          def key():
              return token_urlsafe(38)
          values = [
              "APP_ENV=test", "DEMO_DISPOSABLE=1", "COMPOSE_PROJECT_NAME=" + environ["COMPOSE_PROJECT_NAME"],
              "APP_NOW=2026-11-04T10:05:00+01:00",
              "POSTGRES_PASSWORD=" + password,
              "DATABASE_URL=postgresql+asyncpg://cfo:" + password + "@postgres:5432/cfo",
              "SOURCE_SE_DATABASE_URL=postgresql+asyncpg://cfo:" + password + "@postgres:5432/source_se",
              "SOURCE_SE_API_KEY=" + key(),
              "JWT_SECRET=" + key(),
              "SEED_DEMO_PASSWORD=" + key(),
              "INTERNAL_TICK_KEY=" + key(),
              "SYNTHETIC_WMS_API_KEY=" + key(),
              "SOURCE_DB_NAME=source_se", "SOURCE_SCHEMA=src_se",
              "VITE_API_URL=http://localhost:8000/api/v1", "VITE_USE_MOCKS=false",
              "CORS_ORIGINS='[\"http://localhost:5173\"]'",
          ]
          path = Path(".env")
          path.write_text("\n".join(values) + "\n", encoding="utf-8")
          path.chmod(0o600)
          PY
      - name: E0-04 prepare Source, scope, fleet, shifts, stock WITHOUT Sales Sync/Plan
        if: matrix.scenario != 'reporting'
        run: |
          set -a
          source .env
          set +a
          python tools/e0_04_prepare.py --stop-before-sync
      - name: Prepare official T26 reporting fixture
        if: matrix.scenario == 'reporting'
        run: |
          set -a
          source .env
          set +a
          python tools/e0_04_prepare.py --t26 --seed-report t26-seed-report.json
      - name: Playwright verify KPI and Revenue on official T26
        if: matrix.scenario == 'reporting'
        run: python tools/t27_reporting_browser.py --seed-report t26-seed-report.json --output t27-integrated-e004
      - name: Playwright real CFO Sales Sync → Dispatcher Approve → E2 Mailpit → E3 → Driver → CS
        if: matrix.scenario != 'reporting'
        env:
          APP_NOW: "2026-12-01T10:05:00+01:00"
          T27_TEST_EXPIRE_LICENCE: ${{ matrix.scenario == 'expired_t12' && '1' || '0' }}
        run: |
          set -a
          source .env
          set +a
          export APP_NOW="2026-12-01T10:05:00+01:00"
          set +e
          python tools/t27_integrated_browser.py --output t27-integrated-e004
          result=$?
          set -e
          python - "${{ matrix.scenario }}" "$result" <<'PY'
          import json
          import sys
          from pathlib import Path
          scenario, exit_code = sys.argv[1], int(sys.argv[2])
          report = json.loads(Path("t27-integrated-e004/t27-integrated.json").read_text())
          stages = report["driver_step8"]["stages"]
          statuses = {row["step"]: row["status"] for row in report["steps"]}
          if scenario == "complete":
              assert exit_code == 0 and report["result"] == "PASS_WITH_BLOCKERS"
              assert all(stages[name]["status"] == "PASS" for name in ("dispatch", "gps", "delivered"))
              assert all(statuses[step] == "PASS" for step in ("1", "2", "4", "5", "6", "7", "8", "10", "11"))
          else:
              assert exit_code == 2 and report["result"] == "BLOCKED_STEP8"
              assert stages["dispatch"]["status"] == "BLOCKED"
              assert (stages["dispatch"]["http"], stages["dispatch"]["error_code"]) == (422, "LICENCE_EXPIRED")
              assert stages["gps"]["status"] == stages["delivered"]["status"] == "NOT VERIFIED"
          print("T27 scenario", scenario, "result", report["result"],
                "dispatch HTTP", stages["dispatch"].get("http"),
                "code", stages["dispatch"].get("error_code"),
                "GPS", stages["gps"]["status"], "Delivered", stages["delivered"]["status"])
          PY
      - name: Summarize evidence (synthetic IDs and statuses only)
        if: always()
        run: |
          if [ -f t27-integrated-e004/t27-integrated.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("t27-integrated-e004/t27-integrated.json").read_text())
          print("T27 SHA", d["revision"])
          print("T27 origin", d["origin"])
          print("T27 last", d["last_verified"])
          for x in d["steps"]:
              print("T27", x["step"], x["status"], x["task"])
          PY
          fi
      - name: Upload synthetic UI screenshots + sanitized per-milestone Driver ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t27-integrated-e004-${{ matrix.scenario }}-synthetic-evidence
          path: |
            t27-integrated-e004/*.png
            t27-integrated-e004/t27-integrated.json
            t27-integrated-e004/t27-integrated.md
            t27-integrated-e004/t27-reporting.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Remove the scenario's disposable Compose project
        if: always()
        run: |
          if [ -f .env ]; then
            case "$COMPOSE_PROJECT_NAME" in
              cfo-demo-e004|cfo-demo-t26)
                docker compose --env-file .env -p "$COMPOSE_PROJECT_NAME" down -v --remove-orphans ;;
            esac
          fi
