name: "Temporary formatting diff (non-deploy)"
on:
  push:
    branches:
      - feat/be05-stop-scoped-pod-20261109
jobs:
  inspect-format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check black
      - name: Black proposed diff
        run: |
          cd backend
          black --diff tests/integration/test_execution_api.py
