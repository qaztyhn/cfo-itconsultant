name: GPS M6 final test formatting
on:
  push:
    branches: [feat/m6-gps-backend]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Format GPS integration test, self-remove and commit
        shell: bash
        run: |
          python -m pip install 'black==26.10.1'
          black --line-length 110 backend/tests/integration/test_m6_gps_api.py
          git rm .github/workflows/m6-gps-format-followup.yml
          git add backend/tests/integration/test_m6_gps_api.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(gps): format simulator integration regression'
          git push origin HEAD:feat/m6-gps-backend
