name: M8 strict type-check probe
on:
  push:
    branches: [feat/m8-kpi-backend]
permissions:
  contents: write
jobs:
  mypy-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run strict type check on owned files and remove probe
        shell: bash
        run: |
          cd backend
          python -m pip install -e ".[dev]"
          set +e
          mypy --strict app/services/kpi_service.py app/api/v1/kpi.py
          result=$?
          set -e
          cd ..
          git rm .github/workflows/m8-strict-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(kpi): complete strict typecheck probe"
          git push origin HEAD:feat/m8-kpi-backend
          exit $result
