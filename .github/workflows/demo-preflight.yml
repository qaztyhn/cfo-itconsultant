# Synthetic, non-deploying real-service reproducibility check.
# Separate from normal CI: never claims blocked routing / D7 approval as PASS.
name: demo-preflight
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/demo*"
      - "tools/tests/test_demo_smoke.py"
      - "tools/tests/test_demo_db_verify.py"
      - "backend/app/demo_*.py"
      - "backend/app/api/v1/source_sync.py"
      - "backend/tests/integration/test_source_sync_http_pg.py"
      - "source_system/app/seed_demo.py"
      - "source_system/tests/integration/test_demo_seed.py"
      - "docs/DEMO_SETUP.md"
      - "docs/DEMO_TEST_RESULTS.md"
      - ".github/workflows/demo-preflight.yml"
permissions:
  contents: read
jobs:
  disposable-sweden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guarded smoke controls (stdlib, no network)
        run: python -m unittest discover -s tools/tests -p 'test_demo*.py' -v
      - name: Docker Compose real Source/CFO/frontend synthetic preflight
        run: python tools/demo_ci.py
      - name: Upload non-PII smoke status ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-preflight-status
          path: |
            demo-ci-read-results.json
            demo-ci-sync-results.json
            demo-ci-db-results.json
          if-no-files-found: ignore
          retention-days: 7
