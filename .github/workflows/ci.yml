# CI (08 mục 8, 09 mục 12): ruff, black, mypy (strict engine), import-linter, pytest + Postgres, build web.
# Owner: Dev 2 (luồng B) — M0.
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: ./.github/actions/postgres
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: mypy app/engine
      - run: lint-imports
      - run: pytest
      - run: python -m unittest discover -s tools/tests
        working-directory: .
      - name: Check CFO contract artifact availability
        id: contract
        run: python ../tools/check_openapi.py --baseline ../contracts/cfo.openapi.json --app app.main:app --readiness
      - name: Compare CFO OpenAPI
        if: steps.contract.outputs.ready == 'true'
        run: python ../tools/check_openapi.py --baseline ../contracts/cfo.openapi.json --app app.main:app
  source:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: source_system}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: ./.github/actions/postgres
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: mypy app
      - run: pytest tests/unit tests/integration
      - name: Check source contract artifact availability
        id: contract
        run: python ../tools/check_openapi.py --baseline openapi.yaml --app app.main:app --readiness
      - name: Compare source OpenAPI
        if: steps.contract.outputs.ready == 'true'
        run: python ../tools/check_openapi.py --baseline openapi.yaml --app app.main:app
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
