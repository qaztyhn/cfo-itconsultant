name: M7 formatting verification cleanup
on:
  push:
    branches: [feat/m7-risk-alerts]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format latest M7 test and self-remove
        shell: bash
        run: |
          python -m pip install "black==26.10.1"
          black --line-length 110 backend/tests/integration/test_risk_alerts_api.py
          git rm .github/workflows/m7-format-followup.yml
          git add backend/tests/integration/test_risk_alerts_api.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(risk): format concurrent alert regression"
          git push origin HEAD:feat/m7-risk-alerts
