name: T18 Black final one-shot
on:
  push:
    branches: [feat/task-t18-stock-transfer]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Format T18 only and remove temporary workflow
        run: |
          python -m pip install "black==26.10.1"
          black --line-length 110 backend/app/services/transfer_service.py backend/app/api/v1/transfers.py backend/app/api/v1/planning.py backend/tests/integration/test_transfer_api.py
          git rm .github/workflows/t18-final-format.yml
          git add backend/app/services/transfer_service.py backend/app/api/v1/transfers.py backend/app/api/v1/planning.py backend/tests/integration/test_transfer_api.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(transfers): format T18 safety and regression tests'
          git push origin HEAD:feat/task-t18-stock-transfer
