name: Ephemeral PostgreSQL
description: Start PostgreSQL 16 with a generated password for this job
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        export POSTGRES_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
        echo "::add-mask::$POSTGRES_PASSWORD"
        db_url="postgresql+asyncpg://cfo:${POSTGRES_PASSWORD}@localhost:5432/cfo_test"
        echo "::add-mask::$db_url"
        echo "DATABASE_URL=$db_url" >> "$GITHUB_ENV"
        echo "SOURCE_TEST_DATABASE_URL=$db_url" >> "$GITHUB_ENV"
        docker run -d --name cfo-ci-postgres \
          -e POSTGRES_USER=cfo -e POSTGRES_DB=cfo_test -e POSTGRES_PASSWORD \
          -p 127.0.0.1:5432:5432 --tmpfs /var/lib/postgresql/data \
          --health-cmd='pg_isready -U cfo -d cfo_test' \
          --health-interval=2s --health-timeout=3s --health-retries=30 postgres:16
        for attempt in $(seq 1 30); do
          if [ "$(docker inspect --format '{{.State.Health.Status}}' cfo-ci-postgres)" = healthy ]; then
            exit 0
          fi
          sleep 2
        done
        echo 'PostgreSQL did not become ready' >&2
        exit 1
