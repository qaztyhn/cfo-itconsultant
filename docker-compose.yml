# Docker Compose local (04 mục 3, 13): postgres, mailpit, source-se, cfo-api, cfo-web. Owner: Dev 2 (luồng B) — M0.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cfo
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set in environment or .env}"
      POSTGRES_DB: cfo
      SOURCE_DB_NAME: "${SOURCE_DB_NAME:-source_se}"
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./tools/postgres/init-source-db.sh:/docker-entrypoint-initdb.d/10-source-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfo -d cfo"]
      interval: 5s
      timeout: 3s
      retries: 12
  mailpit:
    image: axllent/mailpit
    ports: ["127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025", "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"]
  source-se:
    build: ./source_system
    environment:
      DATABASE_URL: "${SOURCE_SE_DATABASE_URL:?set in environment or .env}"
      SOURCE_SCHEMA: "${SOURCE_SCHEMA:-src_se}"
      API_KEY: "${SOURCE_SE_API_KEY:?set in environment or .env}"
      APP_NOW: "${APP_NOW:-}"
    ports: ["127.0.0.1:${SOURCE_PORT:-8100}:8100"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 10s
  cfo-api:
    build: ./backend
    environment:
      DATABASE_URL: "${DATABASE_URL:?set in environment or .env}"
      JWT_SECRET: "${JWT_SECRET:?set in environment or .env}"
      INTERNAL_TICK_KEY: "${INTERNAL_TICK_KEY:?set in environment or .env}"
      SOURCE_SE_BASE_URL: http://source-se:8100/api/v1
      SOURCE_SE_API_KEY: "${SOURCE_SE_API_KEY:?set in environment or .env}"
      ORS_API_KEY: "${ORS_API_KEY:-}"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      APP_ENV: "${APP_ENV:-local}"
      APP_NOW: "${APP_NOW:-}"
      SEED_DEMO_PASSWORD: "${SEED_DEMO_PASSWORD:-}"
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173"]}'
    ports: ["127.0.0.1:${CFO_API_PORT:-8000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      source-se: {condition: service_healthy}
      mailpit: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 10s
  cfo-web:
    build: ./frontend
    environment:
      VITE_API_URL: "${VITE_API_URL:-http://localhost:8000/api/v1}"
    ports: ["127.0.0.1:${CFO_WEB_PORT:-5173}:5173"]
    depends_on: [cfo-api]
volumes:
  pgdata: {}
