[project]
name = "cfo-source-system"
version = "0.1.0"
description = "Hệ thống nguồn giả lập (POS/WMS/ERP/fleet) — cùng mã nguồn cho mọi nước, DB riêng (docs/06 mục 16)"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5", "black>=24.4", "mypy>=1.10", "pyyaml>=6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/unit"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ"]

[tool.black]
line-length = 110
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
