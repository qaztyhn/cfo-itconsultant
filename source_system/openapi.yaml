  /api/v1/orders:
    get:
      summary: List Orders Endpoint
      description: Đơn kèm dòng, bản chụp địa chỉ/liên hệ, version, updated_at (06
        mục 16; SRC-Q1/Q6/Q7).
      operationId: list_orders_endpoint_api_v1_orders_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: updated_since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated Since
      - name: status
        in: query
        required: false
        schema:
          enum:
          - DRAFT
          - VALIDATED
          - SUBMITTED_FOR_PLANNING
          - CANCELLED
          type: string
          default: SUBMITTED_FOR_PLANNING
          title: Status
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 50
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
          headers:
            X-Total-Count:
              description: Total matching source rows.
              schema:
                type: integer
                minimum: 0
        '400':
          description: Missing source API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid source API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation errors contain loc/type/msg, never input values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      summary: Create Order
      description: 'POS: tạo đơn nháp (DRAFT).'
      operationId: create_order_api_v1_orders_post
      security:
      - APIKeyHeader: []
      parameters:
