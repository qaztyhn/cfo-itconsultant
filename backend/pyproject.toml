[project]
name = "cfo-backend"
version = "0.1.0"
description = "CFO — Central Fulfilment Orchestration MVP backend (FastAPI). See docs/04_Tech_Stack_and_Architecture.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "holidays>=0.50",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.5",
  "black>=24.4",
  "mypy>=1.10",
  "import-linter>=2.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 110
target-version = ["py312"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ"]
# DTZ: cấm datetime.now()/date.today() không múi giờ — dùng app.core.clock (09 bất biến 17)

[tool.ruff.lint.per-file-ignores]
"app/core/clock.py" = ["DTZ"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.engine.*"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Quy tắc phụ thuộc (04 mục 4): api -> services -> (engine, adapters, providers, domain)
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Engine is pure (09 invariant 6)"
type = "forbidden"
source_modules = ["app.engine"]
forbidden_modules = ["app.services", "app.adapters", "app.providers", "app.api", "app.jobs", "sqlalchemy", "httpx", "requests"]

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = ["app.api", "app.services", "app.engine"]
