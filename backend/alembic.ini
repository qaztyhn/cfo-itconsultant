# Alembic config. Migrations 0001..0008 are hand-written from docs/05_Database_Design.md (no blind autogenerate).
# Keep this file ASCII-only: Alembic/ConfigParser read it with the OS locale encoding (cp1252 on Windows).
[alembic]
script_location = alembic
# sqlalchemy.url comes from the DATABASE_URL environment variable in env.py (no secrets in this file).

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s %(message)s
