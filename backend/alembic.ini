# Alembic config. Migration 0001..0008 sinh TAY từ docs/05_Database_Design.md (không autogenerate mù).
[alembic]
script_location = alembic
sqlalchemy.url = postgresql+asyncpg://cfo:cfo@localhost:5432/cfo

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s %(message)s
